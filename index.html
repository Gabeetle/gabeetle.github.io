<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabeetle | Paka Pa Last</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #0f1115; color: #e0e0e0; }
        header { text-align: center; padding: 50px 20px; background: #1a1d24; border-bottom: 2px solid #333; }
        h1 { margin: 0; font-size: 2.8em; color: #fff; }
        p.subtitle { font-size: 1.2em; color: #888; margin-top: 10px; }
        .container { max-width: 900px; margin: 40px auto; background: #161920; padding: 30px; border-radius: 8px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 25px; }
        .gallery img { width: 100%; border-radius: 6px; border: 1px solid #2a2e39; }
        footer { text-align: center; margin-top: 40px; font-size: 0.9em; color: #555; }
    </style>
</head>
<body>

    <header>
        <h1>Gabeetle</h1>
        <p class="subtitle">Creator & Designer of Paka Pa Last</p>
    </header>

    <div class="container">
        <h2>About the Brand</h2>
        <p>Official portfolio for <strong>Paka Pa Last</strong>, curated and designed by <strong>Gabeetle</strong>. Specializing in brand artwork, technical vector concepts, and custom workwear apparel.</p>

        <h2>Brand & Identity Showcase</h2>
        <div class="gallery">
            <img src="gabeetle-logo-1.png" alt="Gabeetle Primary Brand Logo">
            <img src="gabeetle-logo-2.png" alt="Gabeetle Alternate Logo Concept">
            <img src="gabeetle-paka-pa-last-artwork.jpg" alt="Paka Pa Last Official Artwork and Workwear Design by Gabeetle">
        </div>
    </div>

    <footer>
        <p>&copy; Paka Pa Last | Designed by Gabeetle</p>
    </footer>

</body>
</html>
